services:
  - type: web
    name: nodesh-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: apps/api
    buildCommand: pip install -e .
    startCommand: uvicorn nodesh_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_ORIGIN
        value: https://nodesh.vercel.app
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_WORKSPACE_DOCUMENTS
        value: "25"
      - key: MAX_WORKSPACE_STORAGE_BYTES
        value: "52428800"
      - key: DATABASE_URL
        fromDatabase:
          name: nodesh-db
          property: connectionString

databases:
  - name: nodesh-db
    plan: free
    region: oregon
    databaseName: nodesh
    user: nodesh
